<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew Satisfaction Survey - AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Mobile-first conversational survey player styles */
        .survey-player {
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        .survey-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .conversation-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem;
            text-align: center;
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .ai-avatar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .ai-avatar-small {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            animation: pulse 2s infinite;
        }
        
        .ai-name {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .ai-status {
            font-size: 0.75rem;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        .conversation-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .message {
            display: flex;
            gap: 0.75rem;
            animation: slideInUp 0.5s ease;
        }
        
        .message.ai {
            align-self: flex-start;
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .message.ai .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.user .message-avatar {
            background: #e5e7eb;
            color: #374151;
        }
        
        .message-content {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message.ai .message-content {
            background: white;
            color: #374151;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-bottom-left-radius: 4px;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 0.25rem;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 80px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        
        .question-container {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideInUp 0.5s ease;
        }
        
        .question-number {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            line-height: 1.4;
        }
        
        .answer-options {
            margin-bottom: 2rem;
        }
        
        .answer-option {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .answer-option:hover {
            border-color: var(--primary-color);
            background: rgba(124, 58, 237, 0.05);
            transform: translateY(-1px);
        }
        
        .answer-option.selected {
            border-color: var(--primary-color);
            background: rgba(124, 58, 237, 0.1);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
        }
        
        .answer-option input[type="radio"],
        .answer-option input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin: 0;
        }
        
        .answer-option label {
            cursor: pointer;
            flex: 1;
            font-weight: 500;
            font-size: 1rem;
        }
        
        .rating-scale {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .rating-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 10px;
            transition: all 0.2s;
        }
        
        .rating-option:hover {
            background: rgba(124, 58, 237, 0.1);
        }
        
        .rating-option.selected {
            background: rgba(124, 58, 237, 0.2);
        }
        
        .rating-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 2px solid var(--border-color);
            transition: all 0.2s;
        }
        
        .rating-option.selected .rating-number {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .rating-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }
        
        .survey-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            gap: 1rem;
        }
        
        .btn-nav {
            padding: 1rem 2rem;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1rem;
            min-width: 120px;
        }
        
        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .ai-avatar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .ai-chat {
            position: fixed;
            bottom: 90px;
            right: 20px;
            background: white;
            border-radius: 20px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 250px;
            display: none;
        }
        
        .ai-chat.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .ai-message {
            font-size: 0.875rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .ai-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-muted);
        }
        
        @media (max-width: 480px) {
            .survey-container {
                padding: 0.5rem;
            }
            
            .question-container {
                padding: 1.5rem 1rem;
            }
            
            .answer-option {
                padding: 0.75rem;
            }
            
            .rating-scale {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            
            .rating-option {
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="survey-player">
        <div class="survey-container">
            <!-- Conversation Header -->
            <div class="conversation-header">
                <div class="ai-avatar-header">
                    <div class="ai-avatar-small">🤖</div>
                    <div>
                        <div class="ai-name">AI Assistant</div>
                        <div class="ai-status">
                            <div class="status-dot"></div>
                            <span>Online</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Conversation Container -->
            <div class="conversation-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be dynamically added here -->
                </div>

                <!-- Current Question -->
                <div class="question-container" id="currentQuestion" style="display: none;">
                    <!-- Question will be dynamically loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = 1;
        let totalQuestions = 6;
        let selectedAnswer = null;
        let conversationHistory = [];

        // Question data with AI-generated responses
        const questions = [
            {
                id: 1,
                text: "How easy was it to find your travel itinerary in the app? (1=hard, 5=easy)",
                type: "star-rating",
                options: [1, 2, 3, 4, 5],
                aiIntro: "Hi Isabel! I'd like to do a quick check on your travel & onboarding experience. It takes about 2 minutes. Ready?",
                aiResponses: {
                    "5": "That's great, Isabel! I'm glad the itinerary was easy to find for you.",
                    "4": "Good to hear, Isabel! We're always working to make things even clearer.",
                    "3": "Thanks for the feedback, Isabel. I'll make sure to pass this along to our team.",
                    "2": "Thanks for telling me, Isabel. What made it hard?",
                    "1": "I'm sorry to hear that, Isabel. What made it difficult to find?"
                },
                followUp: {
                    condition: 'rating <= 2',
                    question: "What made it hard?",
                    options: [
                        "I couldn't find the itinerary section",
                        "Details were missing or arrived late", 
                        "App was slow or crashed",
                        "Other (type freely)"
                    ],
                    aiResponse: "Thanks for letting me know, Isabel. Would a push notification when your itinerary updates help next time?",
                    finalResponse: "Perfect, Isabel! I'll make sure we set up push notifications for your itinerary updates.",
                    finalResponseNo: "I understand, Isabel. We'll work on making the itinerary section more visible in the app instead."
                }
            },
            {
                id: 2,
                text: "Did you have any airport pickup/shuttle issues?",
                type: "yes-no",
                aiIntro: "Now let's talk about your airport experience.",
                aiResponses: {
                    "Yes": "I understand, Isabel. What happened?",
                    "No": "That's great, Isabel! I'm glad your pickup went smoothly."
                },
                followUp: {
                    condition: 'answer === "Yes"',
                    question: "What happened?",
                    options: [
                        "A) Couldn't find the greeter",
                        "B) Driver was late", 
                        "C) QR scan didn't work",
                        "D) Other (type freely)"
                    ],
                    aiResponse: "Thanks for letting me know, Isabel.",
                    finalResponse: "Excellent, Isabel! I'll make sure we add that feature to help you find the meeting point more easily.",
                    finalResponseNo: "I understand, Isabel. We'll focus on improving the greeter visibility and signage at the airport instead."
                }
            },
            {
                id: 3,
                text: "How was document upload (passport/visa/medical)? Tell us in your words.",
                type: "open-text",
                aiIntro: "Now let's talk about your document upload experience.",
                aiResponses: {
                    "positive": "That's great, Isabel! I'm glad the document upload went smoothly for you.",
                    "negative": "Sorry for the confusion, Isabel."
                },
                followUp: {
                    condition: 'sentiment === "negative"',
                    question: "Would a progress bar (\"Received → Processing → Verified\") help?",
                    options: [
                        "Yes",
                        "No"
                    ],
                    aiResponse: "Thanks for your feedback, Isabel.",
                    finalResponse: "Perfect, Isabel! I'll make sure we add that progress bar feature to help you track your document status.",
                    finalResponseNo: "I understand, Isabel. We'll work on other ways to improve the document upload experience."
                }
            },
            {
                id: 4,
                text: "How confident are you that you know your next steps? (1–5)",
                type: "star-rating",
                options: [1, 2, 3, 4, 5],
                aiIntro: "Now I'd like to know about your next steps clarity.",
                aiResponses: {
                    "5": "Excellent, Isabel! I'm glad everything is clear for you.",
                    "4": "That's good, Isabel! I'm here if you need any clarification.",
                    "3": "Thanks for the feedback, Isabel. I'll work on making things clearer for you.",
                    "2": "I understand you need more clarity, Isabel.",
                    "1": "I can see this is confusing for you, Isabel."
                },
                followUp: {
                    condition: 'rating <= 2',
                    question: "What would help the most?",
                    options: [
                        "One checklist with due dates",
                        "Reminders in my local time",
                        "Chat with a human",
                        "Other"
                    ],
                    aiResponse: "Thanks for letting me know what would help, Isabel!"
                }
            },
            {
                id: 5,
                text: "How should we send important updates?",
                type: "open-text",
                aiIntro: "Let's talk about communication preferences.",
                aiResponses: {
                    "default": "Perfect, Isabel! I'll make sure we use your preferred channels for updates."
                }
            },
            {
                id: 6,
                text: "Anything else we should change first?",
                type: "open-text",
                aiIntro: "Finally, Isabel, is there anything else I should know?",
                aiResponses: {
                    "default": "Salamat, Isabel! Buod: mapa sa meeting point, mga notification ng itinerary at mas mabilis na verification ng documents. Gagamitin namin ito para mapabuti ang susunod mong biyahe. ✅"
                }
            }
        ];

        // Initialize the survey
        document.addEventListener('DOMContentLoaded', function() {
            // Start the conversation with welcome message
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("Hi Isabel! 👋 I'm your AI assistant, and I'll be guiding you through this quick survey about your travel & onboarding experience.");
                    
                    // Show readiness choice after welcome message
                    setTimeout(() => {
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            showReadinessChoice();
                        }, 2000);
                    }, 2000);
                }, 2000);
            }, 1000);
        });

        // Show readiness choice
        function showReadinessChoice() {
                        addAIMessage("Don't worry, this will only take about 2 minutes of your time. I'll ask you a few questions about your travel experience, and you can answer them at your own pace. Are you ready to get started? 😊");
            
            // Show readiness choice after a brief delay
            setTimeout(() => {
                const questionContainer = document.getElementById('currentQuestion');
                questionContainer.innerHTML = `
                    <div class="question-text">Are you ready to start the survey?</div>
                    <div class="answer-options">
                        <div class="answer-option" onclick="selectReadiness('ready')">
                            <input type="radio" name="readiness" id="ready">
                            <label for="ready">Yes, I'm ready! 🚀</label>
                        </div>
                        <div class="answer-option" onclick="selectReadiness('not-ready')">
                            <input type="radio" name="readiness" id="not-ready">
                            <label for="not-ready">Not ready at the moment 😔</label>
                        </div>
                    </div>
                `;
                questionContainer.style.display = 'block';
                questionContainer.scrollIntoView({ behavior: 'smooth' });
            }, 1000);
        }

        // Handle readiness choice
        function selectReadiness(choice) {
            // Prevent multiple clicks
            if (window.readinessSelected) {
                return;
            }
            window.readinessSelected = true;
            
            // Remove selected class from all options
            document.querySelectorAll('.answer-option').forEach(opt => opt.classList.remove('selected'));
            // Add selected class to clicked option
            event.target.closest('.answer-option').classList.add('selected');
            
            // Check the radio button
            const radio = event.target.closest('.answer-option').querySelector('input[type="radio"]');
            radio.checked = true;
            
            if (choice === 'ready') {
                addUserMessage("Yes, I'm ready! 🚀");
                
                // Hide current question
                const questionContainer = document.getElementById('currentQuestion');
                questionContainer.style.display = 'none';
                
                // Show typing indicator
                showTypingIndicator();
                
                // Start the survey
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("Fantastic! Let's get started then. I'll guide you through each question step by step.");
                    
                    // Show first question after a brief delay
                    setTimeout(() => {
                        showQuestion(0);
                    }, 1500);
                }, 1500);
            } else {
                addUserMessage("Not ready at the moment 😔");
                
                // Hide current question
                const questionContainer = document.getElementById('currentQuestion');
                questionContainer.style.display = 'none';
                
                // Show typing indicator
                showTypingIndicator();
                
                // Handle not ready response
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("No problem at all! I completely understand. Sometimes we need a moment to gather our thoughts.");
                    
                    setTimeout(() => {
                        addAIMessage("When you're ready, just refresh this page and we can start fresh. Take your time! 😊");
                    }, 2000);
                }, 1500);
            }
        }

        // Show question with AI intro
        function showQuestion(questionIndex) {
            const question = questions[questionIndex];
            
            // Add AI intro message
            addAIMessage(question.aiIntro);
            
            // Show question after a brief delay
            setTimeout(() => {
                const questionContainer = document.getElementById('currentQuestion');
                questionContainer.innerHTML = generateQuestionHTML(question);
                questionContainer.style.display = 'block';
                questionContainer.scrollIntoView({ behavior: 'smooth' });
            }, 1000);
        }

        // Select answer and continue conversation
        function selectAnswer(element, answer) {
            // Prevent multiple clicks
            if (window.answerSelected) {
                return;
            }
            window.answerSelected = true;
            
            // Remove selected class from all options
            document.querySelectorAll('.answer-option').forEach(opt => opt.classList.remove('selected'));
            // Add selected class to clicked option
            element.classList.add('selected');
            // Check the radio button
            const radio = element.querySelector('input[type="radio"]');
            if (radio) {
                radio.checked = true;
            }

            selectedAnswer = answer;
            
            // Add user response to chat
            addUserMessage(answer);
            
            // Hide current question
            const questionContainer = document.getElementById('currentQuestion');
            questionContainer.style.display = 'none';
            
            // Show typing indicator
            showTypingIndicator();
            
            // Process answer and move to next question
            setTimeout(() => {
                hideTypingIndicator();
                processAnswer(answer);
            }, 1500);
        }

        // Process user answer and continue conversation
        function processAnswer(answer) {
            console.log('processAnswer called with:', answer);
            console.log('Current question:', currentQuestion);
            console.log('Question type:', questions[currentQuestion - 1].type);
            
            conversationHistory.push({
                question: questions[currentQuestion - 1].text,
                answer: answer,
                timestamp: new Date()
            });

            // Simulate data collection and AI processing
            simulateDataCollection(answer, currentQuestion - 1);

            // Get AI response based on answer
            const aiResponse = getAIResponse(answer, currentQuestion - 1);
            addAIMessage(aiResponse);

            // Check if there's a follow-up question
            const currentQ = questions[currentQuestion - 1];
            console.log('Checking for follow-up question:', currentQ.followUp);
            
            // Special handling for pickup question - only show follow-up for "Yes"
            if (currentQ.id === 2 && answer === "No") {
                console.log('Pickup question with No answer - no follow-up');
                // Move to next question or finish
                if (currentQuestion < totalQuestions) {
                    setTimeout(() => {
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            nextQuestion();
                        }, 2000);
                    }, 1000);
                } else {
                    setTimeout(() => {
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            finishSurvey();
                        }, 2000);
                    }, 1000);
                }
            } else if (currentQ.followUp && shouldShowFollowUp(answer, currentQ.followUp)) {
                console.log('Follow-up question will be shown');
                setTimeout(() => {
                    showFollowUpQuestion(currentQ.followUp);
                }, 1500);
            } else if (currentQ.type === 'open-text' && currentQ.followUp && currentQ.followUp.condition === 'sentiment === "negative"') {
                console.log('Matched sentiment condition for question', currentQ.id);
                // Check sentiment for open-text questions with sentiment-based follow-up
                console.log('Checking sentiment for question', currentQ.id, 'with answer:', answer);
                const sentiment = analyzeSentiment(answer);
                console.log('Document upload sentiment:', sentiment);
                console.log('Follow-up condition:', currentQ.followUp.condition);
                if (sentiment === 'negative') {
                    console.log('Negative sentiment detected, showing progress bar question');
                    setTimeout(() => {
                        showProgressBarQuestion();
                    }, 1500);
                } else {
                    console.log('Positive sentiment, no follow-up needed');
                    // Move to next question or finish
                    if (currentQuestion < totalQuestions) {
                        setTimeout(() => {
                            showTypingIndicator();
                            setTimeout(() => {
                                hideTypingIndicator();
                                nextQuestion();
                            }, 2000);
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            showTypingIndicator();
                            setTimeout(() => {
                                hideTypingIndicator();
                                finishSurvey();
                            }, 2000);
                        }, 1000);
                    }
                }
            } else {
                console.log('No follow-up question, proceeding to next question');
                console.log('Current question:', currentQuestion, 'Total questions:', totalQuestions);
                // Move to next question or finish
                if (currentQuestion < totalQuestions) {
                    console.log('Moving to next question');
                    setTimeout(() => {
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            nextQuestion();
                        }, 2000);
                    }, 1000);
                } else {
                    console.log('Finishing survey');
                    setTimeout(() => {
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            finishSurvey();
                        }, 2000);
                    }, 1000);
                }
            }
        }

        function shouldShowFollowUp(answer, followUp) {
            console.log('shouldShowFollowUp called with:', answer, followUp);
            if (followUp.condition === 'rating <= 2') {
                const result = parseInt(answer) <= 2;
                console.log('Rating condition result:', result);
                return result;
            } else if (followUp.condition === 'answer === "Yes"') {
                const result = answer === 'Yes';
                console.log('Yes condition result:', result);
                return result;
            }
            console.log('No condition matched, returning false');
            return false;
        }

        function showFollowUpQuestion(followUp) {
            console.log('showFollowUpQuestion called with:', followUp);
            console.log('Current window.followUpSelected before reset:', window.followUpSelected);
            // Reset the follow-up selected flag
            window.followUpSelected = false;
            console.log('Reset window.followUpSelected to false');

        // AI Features: Sentiment Analysis and Translation
        function analyzeSentiment(text) {
            // Simple sentiment analysis simulation
            const negativeWords = ['hard', 'difficult', 'late', 'missing', 'slow', 'crashed', 'confused', 'pending', 'still', 'showed', 'uploaded', 'medical', 'status', 'problem', 'issue', 'trouble', 'error', 'failed', 'stuck', 'not working', 'broken', 'frustrating', 'annoying', 'terrible', 'awful', 'bad', 'wrong', 'incorrect', 'doesn\'t work', 'won\'t work', 'can\'t upload', 'unable', 'impossible'];
            const positiveWords = ['easy', 'great', 'good', 'excellent', 'smooth', 'clear', 'helpful', 'perfect', 'wonderful', 'amazing', 'fantastic', 'quick', 'fast', 'simple', 'straightforward', 'convenient', 'efficient', 'reliable', 'working', 'successful', 'completed', 'done', 'finished', 'uploaded successfully', 'no problem', 'no issues'];
            
            const lowerText = text.toLowerCase();
            let sentiment = 0;
            
            console.log('Analyzing sentiment for text:', text);
            console.log('Lowercase text:', lowerText);
            
            negativeWords.forEach(word => {
                if (lowerText.includes(word)) {
                    console.log('Found negative word:', word);
                    sentiment -= 1;
                }
            });
            
            positiveWords.forEach(word => {
                if (lowerText.includes(word)) {
                    console.log('Found positive word:', word);
                    sentiment += 1;
                }
            });
            
            console.log('Final sentiment score:', sentiment);
            const result = sentiment < 0 ? 'negative' : sentiment > 0 ? 'positive' : 'neutral';
            console.log('Sentiment result:', result);
            return result;
        }

        function simulateTranslation(text) {
            // Simulate translation detection and response
            const filipinoWords = ['oo', 'handa', 'salamat', 'pakiusap', 'pasensya', 'tulong', 'mabuti', 'masaya'];
            const lowerText = text.toLowerCase();
            
            return filipinoWords.some(word => lowerText.includes(word)) ? 'fil' : 'en';
        }

            addAIMessage("Thank you so much for taking the time to complete this travel survey, Isabel! 🙏 Your feedback is incredibly valuable to me and will help us improve your next travel experience.");
            
            setTimeout(() => {
                addAIMessage("I really appreciate your input, Isabel, and I'll make sure to use it to make your next travel experience even better. Have a great day! 😊");
                
                // Show restart option after completion
                setTimeout(() => {
                    addAIMessage("Would you like to take the survey again or try a different survey? Just let me know!");
                    
                    setTimeout(() => {
                        const questionContainer = document.getElementById('currentQuestion');
                        questionContainer.innerHTML = `
                            <div class="question-text">What would you like to do next?</div>
                            <div class="answer-options">
                                <div class="answer-option" onclick="restartSurvey()">
                                    <input type="radio" name="next-action" id="restart">
                                    <label for="restart">Take this survey again 🔄</label>
                                </div>
                                <div class="answer-option" onclick="showOtherSurveys()">
                                    <input type="radio" name="next-action" id="other-surveys">
                                    <label for="other-surveys">View other surveys 📋</label>
                                </div>
                                <div class="answer-option" onclick="endSession()">
                                    <input type="radio" name="next-action" id="end">
                                    <label for="end">End session 👋</label>
                                </div>
                            </div>
                        `;
                        questionContainer.style.display = 'block';
                        questionContainer.scrollIntoView({ behavior: 'smooth' });
                    }, 1000);
                }, 2000);
            }, 2000);
        }

        // Restart survey
        function restartSurvey() {
            // Reset variables
            currentQuestion = 1;
            selectedAnswer = null;
            conversationHistory = [];
            
            // Reset flags
            window.readinessSelected = false;
            window.answerSelected = false;
            window.followUpSelected = false;
            window.additionalSelected = false;
            window.freeTextSubmitted = false;
            window.additionalQuestionShown = false;
            window.sessionEnded = false;
            window.otherSurveysShown = false;
            
            // Clear chat messages
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            // Hide current question
            const questionContainer = document.getElementById('currentQuestion');
            questionContainer.style.display = 'none';
            
            // Start fresh
            addUserMessage("Take this survey again 🔄");
            
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("Great! Let's start fresh. I'll guide you through the travel survey again.");
                    
                    setTimeout(() => {
                        showQuestion(0);
                    }, 1500);
                }, 1500);
            }, 1000);
        }

        // Show other surveys
        function showOtherSurveys() {
            if (window.otherSurveysShown) return;
            window.otherSurveysShown = true;
            
            addUserMessage("View other surveys 📋");
            
            const questionContainer = document.getElementById('currentQuestion');
            questionContainer.style.display = 'none';
            
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("I'd love to show you other surveys, but this is just a demo! In the full version, you'd see a list of available surveys here.");
                    
                    setTimeout(() => {
                        addAIMessage("For now, would you like to take this survey again or end the session?");
                        
                        setTimeout(() => {
                            const questionContainer = document.getElementById('currentQuestion');
                            questionContainer.innerHTML = `
                                <div class="question-text">What would you like to do?</div>
                                <div class="answer-options">
                                    <div class="answer-option" onclick="restartSurvey()">
                                        <input type="radio" name="demo-action" id="demo-restart">
                                        <label for="demo-restart">Take this survey again 🔄</label>
                                    </div>
                                    <div class="answer-option" onclick="endSession()">
                                        <input type="radio" name="demo-action" id="demo-end">
                                        <label for="demo-end">End session 👋</label>
                                    </div>
                                </div>
                            `;
                            questionContainer.style.display = 'block';
                            questionContainer.scrollIntoView({ behavior: 'smooth' });
                        }, 1000);
                    }, 2000);
                }, 1500);
            }, 1000);
        }

        // End session
        function endSession() {
            if (window.sessionEnded) return;
            window.sessionEnded = true;
            
            addUserMessage("End session 👋");
            
            const questionContainer = document.getElementById('currentQuestion');
            questionContainer.style.display = 'none';
            
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addAIMessage("Thank you for your time, Isabel! It was great chatting with you. Take care! 😊");
                }, 1500);
            }, 1000);
        }

        // Add AI message to chat
        function addAIMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div>${text}</div>
                    <div class="message-time">Just now</div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Add user message to chat
        function addUserMessage(text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `
                <div class="message-avatar">👤</div>
                <div class="message-content">
                    <div>${text}</div>
                    <div class="message-time">Just now</div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Show typing indicator
        function showTypingIndicator() {
            const chatMessages = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
    </script>
</body>
</html>
